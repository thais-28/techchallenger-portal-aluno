# docker-compose.yml

services:
  mongo:
    image: mongo:7
    container_name: ${DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "${PORT}:3333" # Mapeia a porta da API para o host
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      DATABASE: ${DATABASE}
      PORT: ${PORT}
    depends_on:
      - mongo
    volumes:
      - /usr/src/app/node_modules

volumes:
  mongo-data:
